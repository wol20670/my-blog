<!-- 명조(Wuthering Waves) 테마 웹폰트.

     이 파일은 Chirpy v7.6.0 이 <head> 끝에 include 하는 빈 확장 지점이다
     (원본 내용: "A placeholder to allow defining custom metadata").
     head.html 을 통째로 복사하는 것보다 gem 업데이트와 충돌할 여지가 적다.

     CSS 쪽에 @import 로 넣지 않는 이유:
     @import 는 모든 스타일 규칙보다 앞서야 하는데, 커스텀 CSS 블록 위에는
     이미 Chirpy 규칙 수천 줄이 출력돼 있어 브라우저가 조용히 버린다.

     Chirpy 가 fonts.googleapis.com / fonts.gstatic.com 은 이미 preconnect 하므로
     jsDelivr 만 추가로 예열한다. -->
<!-- 첫 방문은 흑조(다크).
     Chirpy 는 저장된 선택이 없으면 OS 설정을 따라간다. 이 블로그의 기본은 흑조라서
     선택이 없을 때 "dark 를 고른 것" 으로 저장해 둔다. 그러면 Chirpy 의 Theme 클래스가
     보는 값(저장값)과 화면이 어긋나지 않아 Mermaid 색·토글 아이콘도 맞게 따라온다.
     그래서 사이드바 토글에서 "시스템" 항목은 뺐다 — 저장값을 지워도 여기서 다시 dark 가 된다.

     Chirpy 의 theme.min.js 가 이보다 먼저 실행되므로 첫 방문 한 번은 DOM 도 직접 바꾼다.
     <head> 안의 동기 스크립트라 본문이 그려지기 전에 끝난다(깜빡임 없음).
     ⚠ compress_html 이 HTML 을 한 줄로 압축하므로 여기서는 // 주석을 쓰면 안 된다. -->
<script>
  (function () {
    var root = document.documentElement;
    try {
      if (!localStorage.getItem('theme')) {
        localStorage.setItem('theme', 'dark');
      }
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') {
        root.setAttribute('data-bs-theme', t);
        root.setAttribute('data-theme-persisted', '');
      }
    } catch (e) {
      root.setAttribute('data-bs-theme', 'dark');
    }
  })();
</script>

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

<!-- 본문(한글): Pretendard.
     dynamic subset 이라 실제로 쓰인 글자가 속한 조각만 내려받는다. -->
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<!-- 라틴/숫자/UI 라벨: Advent Pro.
     명조 공식 사이트가 실제로 쓰는 서체다. 라틴 전용이라 한글은 영향이 없다. -->
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Advent+Pro:wght@300;500;700&amp;display=swap">

<!-- 홈의 "공명자 선택" 상호작용.
     defer 라 <head> 에 있어도 문서 파싱이 끝난 뒤에 실행된다.
     relative_url 을 거쳐야 baseurl(/my-blog)이 붙는다. -->
<script defer src="{{ '/assets/js/wuwa-select.js' | relative_url }}"></script>
