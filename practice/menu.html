<!DOCTYPE html>
<html lang="ko">
<head>

  <title>카페 메뉴</title>

</head>
<body>

  <h1>카페 메뉴</h1>

  <main class="menu-list">

      <p class="price">4,500원</p>

    <div class="menu-card">
      <div class="thumb"></div>
      <h2 class="menu-name">카페라떼</h2>
      <p class="price">5,000원</p>
    </div>

    <div class="menu-card">
      <div class="thumb"></div>
      <h2 class="menu-name">바닐라 콜드브루</h2>
      <p class="price">5,800원</p>
    </div>

  </main>

</body>
</html>
